<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Medi-Reach</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1 class="logo">Medi-Reach</h1>
                <nav class="navigation">
                    <a href="{{ url_for('home') }}" class="nav-link">Home</a>
                    <a href="{{ url_for('medicines') }}" class="nav-link">Medicines</a>
                    <a href="{{ url_for('order.order') }}" class="nav-link">Order</a>
                    <a href="{{ url_for('contact') }}" class="nav-link">Contact</a>
                    <a href="{{ url_for('track') }}" class="nav-link">Track Order</a>
                </nav>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            {% block content %}
            <!-- Content will be injected here from other templates -->
            {% endblock %}
        </main>
    </div>
</body>
</html>
