{% extends "index.html" %}

{% block content %}
<div class="form-container">
    <h2 class="form-title">Registration Form</h2>
    <p class="form-description">Please fill in your personal and medical information</p>
    <form method="POST" action="{{ url_for('auth_bp.register') }}">
        <div class="form-group">
            <label class="form-label">Full Name</label>
            <input type="text" name="full_name" class="form-input" placeholder="Enter your full name" required>
        </div>
        <div class="form-group">
            <label class="form-label">Date of Birth</label>
            <input type="date" name="dob" class="form-input" required>
        </div>
        <div class="form-group">
            <label class="form-label">Country</label>
            <input type="text" name="country" class="form-input" placeholder="Enter your country" required>
        </div>
        <div class="form-group">
            <label class="form-label">Number</label>
            <input type="tel" name="phone" class="form-input" placeholder="Enter your phone number" required>
        </div>
        <button type="submit" class="btn btn-full">Submit Registration</button>
    </form>
</div>
{% endblock %}
